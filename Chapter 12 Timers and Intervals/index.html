<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Download Simulation UI</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="glass-card">
        <h2>Downloading File</h2>
        <p class="file-name">project.zip</p>

        <div class="progress-container">
            <div class="progress-bar"></div>
        </div>

        <div class="details">
            <span>Speed: 2.4 MB/s</span>
            <span>Remaining: 12s</span>
        </div>

        <button>Pause</button>
    </div>
    <script src="script.js"></script>

</body>
</html>
