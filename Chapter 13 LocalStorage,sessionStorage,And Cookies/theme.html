<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Theme Preference</title>
    <link rel="stylesheet" href="theme.css";
</head>
<body>

    <!-- Theme Toggle -->
    <input type="checkbox" id="theme-toggle">

    <div class="page">
        <header>
            <h1>Theme Preference</h1>

            <label for="theme-toggle" class="toggle">
                <span class="sun">☀️</span>
                <span class="moon">🌙</span>
                <div class="slider"></div>
            </label>
        </header>

        <main>
            <p>
                This website allows users to switch between
                Light Mode and Dark Mode using only HTML and CSS.
            </p>

            <div class="card">
                <h3>About</h3>
                <p>
                    Theme preferences improve accessibility,
                    reduce eye strain, and enhance user experience.
                </p>
            </div>
        </main>

        <footer>
            <p>© 2025 Theme Preference UI</p>
        </footer>
    </div>
    <script src="theme.js"></script>

</body>
</html>
