<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FORMS AND FORM VALIDATION</title>
</head>
<body>
    <form>
        <input pattern="[a-z]{3,8}" minlength="3" maxlength="10" type="text" placeholder="name"><br><br>
        <small>Your name should be greater than 2 characters</small><br><br>
        <input type="email" placeholder="email"><br><br>
        <input type="password" placeholder="password"><br><br>
        <select name="" id="">
            <option value="male">male</option>
            <option value="Female">Female</option>
            <option value="other">other</option>

        </select><br><br>
        <textarea name="" id="" placeholder="Tell us about you..."></textarea><br><br>
        <input type="submit" value="" placeholder="submit">
    </form>
    <script src="script.js"></script>
    
</body>
</html>
